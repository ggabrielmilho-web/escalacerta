<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
  /* prévia de link: 1200×630. Tudo o que importa fica no quadrado do meio (630×630),
     que é o pedaço que o WhatsApp mostra quando corta a imagem em quadradinho */
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f3f5f1; font-family: "Atkinson Hyperlegible", sans-serif; color: #17231e; position: relative; }
  .lado { position: absolute; top: 0; bottom: 0; width: 285px; display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 10px; padding: 60px 34px; align-content: center; }
  .lado.esq { left: 0; } .lado.dir { right: 0; }
  .lado span { aspect-ratio: 1; border-radius: 9px; background: #e3e9e5; }
  .lado span.f { background: #cdebd3; }
  .meio { position: absolute; left: 285px; width: 630px; top: 0; bottom: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 34px; }
  .meio img { width: 540px; }
  h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 40px; line-height: 1.15; letter-spacing: -0.01em; white-space: nowrap; }
  h1 b { color: #0e5f52; }
  p { font-size: 25px; color: #56655e; }
  .selo { display: inline-block; background: #0e5f52; color: #fff; font-weight: 700; font-size: 22px; padding: 9px 20px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="lado esq" id="esq"></div>
  <div class="meio">
    <img src="../gerador/img/logo.svg" alt="">
    <h1>Quantas pessoas sua empresa<br>vai precisar no <b>5x2</b>?</h1>
    <span class="selo">Calcule grátis em 2 minutos</span>
  </div>
  <div class="lado dir" id="dir"></div>
<script>
  // calendário de folgas desenhado: cada linha é uma semana, com 2 folgas em verde
  const semanas = [[1, 2], [0, 4], [3, 4], [1, 3], [0, 2], [2, 4], [1, 4], [0, 3]];
  for (const id of ['esq', 'dir']) {
    const el = document.getElementById(id);
    (id === 'dir' ? semanas.slice().reverse() : semanas).forEach(f => {
      for (let d = 0; d < 5; d++) { const s = document.createElement('span'); if (f.includes(d)) s.className = 'f'; el.appendChild(s); }
    });
  }
</script>
</body>
</html>
